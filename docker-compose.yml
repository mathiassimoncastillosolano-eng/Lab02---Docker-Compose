version: "3"

services:
  
  api01:
    container_name: api01
    build: ./api

    environment:
      - MESSAGE=${NOMBRE}
    ports:
      - "3000:3000"

  
  api02:
    container_name: api02
    build: ./api

    environment:
      - MESSAGE=${NOMBRE2}
    ports:
      - "3001:3000"


  api03:
    container_name: api03
    build: ./api

    environment:
      - MESSAGE=${NOMBRE3}
    ports:
      - "3002:3000"
    

  db:
    image: postgres:13
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

    